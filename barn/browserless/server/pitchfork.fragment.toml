# Pitchfork daemon fragment — merged into the [daemons.browserless] section
# of /home/toxic/sovereign/pitchfork.toml (owned sequence: stop -> ss-verify ->
# clean --daemon -> start from /home/toxic/sovereign).
[daemons.browserless]
port = 25130
run = "exec /home/toxic/sovereign/projects/mesh/browserless/server/run.sh"
dir = "."
mise = false
retry = true
ready_cmd = "ss -ltn 'sport = :25130' | grep -q LISTEN"
boot_start = true
env = { BROWSERLESS_PORT = "25130", WAYLAND_DISPLAY = "wayland-1", XDG_RUNTIME_DIR = "/run/user/1000", BROWSERLESS_CONNECTION_TIMEOUT = "900000" }
auto = ["start"]
