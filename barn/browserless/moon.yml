$schema: 'https://moonrepo.dev/schemas/project.json'
language: 'typescript'
layer: 'application'
tasks:
  build:
    command: 'bun --cwd keeper run build'
    inputs: ['keeper/src/**/*', 'keeper/tsconfig.json', 'keeper/package.json']
    outputs: ['keeper/dist']
  lint:
    command: 'bun --cwd keeper run lint'
    inputs: ['keeper/src/**/*']
