# toxicwind/archguard integration (Forge, 2026-10-20; re-landed as composer
# fragment 2026-10-23 after a pitchfork-compose regen wiped the hand-added
# block in pitchfork.toml — LESSON CORRECTED: pitchfork.toml is GENERATED by
# bin/pitchfork-compose from these fragments; the fragments are the owning
# layer, hand edits to pitchfork.toml are ephemeral. (The Oct-20 "fragments
# inert" claim died with the regen commit bcf9562ca0.)
#
# Deterministic pre-merge audit: FalkorDB graph engine + LLM-free auditor.
# Ranch code: barn/archguard (in-tree import of toxicwind/archguard @ 9f925e6;
# provenance in barn/archguard/SOURCE.md). Estate seed graph:
# archguard_estate (barn/archguard/src/scripts/seedEstate.ts, npm run
# seed:estate).
#
# NOTE: the falkordb image persists dump.rdb under /var/lib/falkordb/data
# (its WORKDIR), not /data — mounting the named volume there is what makes
# restarts actually restart-surviving (estate 1ad9d3ab; verified 2/2).


[daemons.archguard-falkordb]
run = "exec bash -c 'docker start archguard-falkordb >/dev/null 2>&1 || docker run --rm --name archguard-falkordb -p 127.0.0.1:6379:6379 -p 127.0.0.1:13000:3000 -v archguard_falkordb_data:/var/lib/falkordb/data falkordb/falkordb:latest'"
dir = "/home/toxic/pens/ranch/products/barn/archguard"
mise = false
retry = true
boot_start = true
auto = ["start"]
ready_cmd = "redis-cli -h 127.0.0.1 -p 6379 ping | grep -q PONG"


