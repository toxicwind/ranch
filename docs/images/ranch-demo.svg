<svg xmlns="http://www.w3.org/200/svg" width="720" height="400" viewBox="0 0 720 400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect width="720" height="400" rx="10" fill="#0d1117"/>
  <rect x="0" y="0" width="720" height="34" rx="10" fill="#161b22"/>
  <rect x="0" y="24" width="720" height="10" fill="#161b22"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="17" r="6" fill="#ebbd2d"/>
  <circle cx="60" cy="17" r="6" fill="#27c93f"/>
  <text x="360" y="22" text-anchor="middle" font-size="13" fill="#8b949e">toxic@yote: ~/ranch — 30-second proof (verified 2026-10-02)</text>
  <g font-size="14">
    <text x="18" y="62" fill="#27c93f">$</text>
    <text x="32" y="62" fill="#e6edf3">curl -s 127.0.0.1:25100/v1/models | jq -r '.data[].id' | head -4</text>
    <text x="18" y="88" fill="#8b949e">beellama/exaone-4-0-1-2b-iq4xs</text>
    <text x="18" y="110" fill="#8b949e">beellama/exaone-4-0-1-2b-q4km</text>
    <text x="18" y="132" fill="#8b949e">beellama/exaone-4-0-1-2b-q5km</text>
    <text x="18" y="154" fill="#8b949e">beellama/exaone-4-0-1-2b-q6k</text>
    <text x="18" y="176" fill="#8b949e">… 48 more — 52 models, one OpenAI-compatible door</text>
    <text x="18" y="206" fill="#27c93f">$</text>
    <text x="32" y="206" fill="#e6edf3">for p in 25100 25193 25127 25151 25200; do</text>
    <text x="32" y="228" fill="#e6edf3">  printf '%s %s\n' "$p" "$(curl -s -o /dev/null -w '%{http_code}' 127.0.0.1:$p/health)"; done</text>
    <text x="18" y="254" fill="#8b949e">25100 <tspan fill="#27c93f" font-weight="bold">200</tspan>   <tspan fill="#8b949e">herd — local front door</tspan></text>
    <text x="18" y="276" fill="#8b949e">25193 <tspan fill="#27c93f" font-weight="bold">200</tspan>   <tspan fill="#8b949e">flock — cloud provider router</tspan></text>
    <text x="18" y="298" fill="#8b949e">25127 <tspan fill="#27c93f" font-weight="bold">200</tspan>   <tspan fill="#8b949e">gatehouse — MCP gateway</tspan></text>
    <text x="18" y="320" fill="#8b949e">25151 <tspan fill="#27c93f" font-weight="bold">200</tspan>   <tspan fill="#8b949e">oracle — decision engine</tspan></text>
    <text x="18" y="342" fill="#8b949e">25200 <tspan fill="#27c93f" font-weight="bold">200</tspan>   <tspan fill="#8b949e">cuttinggate — canonical router</tspan></text>
    <text x="18" y="372" fill="#27c93f">$ <rect x="30" y="362" width="9" height="16" fill="#27c93f"><animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/></rect></text>
  </g>
</svg>
