name: ci

# Ranch monorepo CI — moon runs only the tasks affected by the change.
# Push to main runs everything; PRs run the affected slice.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  monorepo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # de6a9e19 converted vendored peer clones to submodules; the bun
      # workspaces drover, drover/sidecar, metaaivm-profile and
      # forge/router/{cuttinggate,herd} are gitlinks now, and checkout
      # does not init submodules by default -- bun install then fails
      # with "Workspace not found". Init only the workspace submodules
      # (all public), not the full 54-submodule tree. (Carries forward
      # open PR #4's init step; that PR alone still failed, see below.)
      - name: Init workspace submodules
        run: git submodule update --init --depth 1 drover metaaivm-profile forge

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install moon
        run: |
          # bun's global install skips the @moonrepo/cli optional platform
          # package, so install it explicitly -- otherwise `moon --version`
          # dies with MODULE_NOT_FOUND @moonrepo/core-linux-x64-gnu/package.json.
          bun add -g @moonrepo/cli @moonrepo/core-linux-x64-gnu
          sudo ln -sf "$HOME/.bun/install/global/node_modules/@moonrepo/core-linux-x64-gnu/moon" /usr/local/bin/moon
          moon --version

      - name: Install jj (Jujutsu)
        run: |
          mkdir -p /tmp/jjdl
          curl -fsSL "https://github.com/jj-vcs/jj/releases/download/v0.32.0/jj-v0.32.0-x86_64-unknown-linux-musl.tar.gz" | tar xz -C /tmp/jjdl
          sudo install -m 755 /tmp/jjdl/jj /usr/local/bin/jj
          jj --version

      - name: Install JS workspaces
        # --ignore-scripts: with the submodules present, bun install runs
        # drover's "install" script (code-insiders --install-extension),
        # which fails 127 on runners (no code-insiders; PR #4's run
        # 40832829494 died exactly there). Installing a VS Code extension
        # is not a CI build step, and no other workspace -- tracked or
        # submodule -- defines a lifecycle install script, so skipping
        # scripts loses nothing the moon build/test steps need.
        run: bun install --ignore-scripts
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - name: Install tau-marketplace deps
        run: |
          TM_FILE="$(find . -maxdepth 4 -name package.json -path '*tau-marketplace*' -not -path './node_modules/*' | head -1)"
          [ -n "$TM_FILE" ] || { echo "tau-marketplace not found after reorg"; exit 1; }
          TM_DIR="$(dirname "$TM_FILE")"
          echo "tau-marketplace at $TM_DIR"
          (cd "$TM_DIR" && bun install)
          for d in "$TM_DIR"/plugins/*/; do
            if [ -f "$d/package.json" ]; then (cd "$d" && bun install); fi
          done

      - name: Setup Python test env
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pytest python3-venv
          /usr/bin/python3 -m venv lasso/.venv
          lasso/.venv/bin/pip install --quiet -e ./lasso pytest

      - name: Affected tasks (PR)
        if: github.event_name == 'pull_request'
        run: moon ci

      - name: All tasks (push to main)
        if: github.event_name == 'push'
        run: moon run :build :test :lint
