name: corral CI

# GitHub runs workflows from the repo ROOT only. This is the live CI for the
# corral package (ranch/corral): bun install + typecheck + test, path-filtered
# so it only fires when corral or this workflow changes.
# (corral/.github/workflows/ci.yml mirrors these same gates as the
# package-local contract.)

on:
  push:
    branches: [main]
    paths:
      - "corral/**"
      - ".github/workflows/corral.yml"
  pull_request:
    paths:
      - "corral/**"
      - ".github/workflows/corral.yml"

permissions:
  contents: read

concurrency:
  group: corral-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: install, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      # The monorepo install (16 workspaces) is slow cold; cache the bun
      # store keyed on the root lockfile so warm runs finish in ~30s.
      - name: Cache bun store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      # Install at the repo ROOT (where bun.lock lives): corral has no own
      # lockfile, so bun walks up here anyway. Explicit beats implicit.
      - name: Install (frozen lockfile)
        timeout-minutes: 15
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: corral
        run: bun run typecheck
      - name: Test
        working-directory: corral
        run: bun test tests/