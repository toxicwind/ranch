name: hourly-sync

# Autonomous Ranch & Submodule Synchronizer
# Runs hourly to:
#   1. Fetch remote tracking heads for registered submodules
#   2. Fast-forward submodule gitlinks cleanly
#   3. Audit components and re-render README with live GitHub descriptions
#   4. Commit and push any pointer or catalog drift

on:
  schedule:
    - cron: "0 * * * *" # every hour, on the hour
  workflow_dispatch: # manual trigger

permissions:
  contents: write

concurrency:
  group: hourly-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Auto-advance submodule pointers
        run: |
          git submodule update --init --recursive --remote --merge || true

      - name: Audit (regenerate FORKS-report)
        run: bun toolkit/audit-forks.ts

      - name: Render README with live descriptions
        run: bun toolkit/generate-readme.ts --update

      - name: Commit + push if changed
        run: |
          git config user.name "ranch-sync-bot"
          git config user.email "fleet@toxicwind.dev"
          if [[ -n "$(git status --porcelain)" ]]; then
            git add -A
            git commit -m "bot: auto-advance submodules + regen catalog"
            git push
          else
            echo "no changes; skip"
          fi
