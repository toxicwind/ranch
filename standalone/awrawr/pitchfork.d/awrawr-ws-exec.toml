# standalone/awrawr — project-owned daemon manifest. Source of truth for 'awrawr-ws-exec'.
# Owned by the standalone/awrawr project; the parent only composes it.


[daemons.awrawr-ws-exec]
port = 25204
env = { WS_EXEC_PORT = "25204" }
# NOTE: runs the TRACKED source; /home/toxic/awrawr_ws_exec.py is kept
# as a synced fallback copy (do not delete).
run = "exec /home/toxic/.awrawr-mcp-venv/bin/python /home/toxic/sovereign/bridge/awrawr_ws_exec.py"
dir = "/home/toxic"
mise = false
retry = true
auto = ["start"]

# Historical note: the old brand/flicker build queue used :25148. It was
# replaced by estate/ops/mbx-cache, the mise remote task-cache server.
