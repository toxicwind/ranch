# standalone/tau — project-owned daemon manifest. Source of truth for 'tau'.
# Owned by the standalone/tau project; the parent only composes it.

[daemons.tau]
# omp acp exposed as TCP daemon via chute (stdio→TCP + mcpServers normalization)
port = 25111
run = "exec /home/toxic/sovereign/projects/range/ranch/barn/chute/chute.mjs --port 25111 -- /home/toxic/.local/bin/tau acp -e /home/toxic/.tau/extensions/vansrouter.ts"
# 2026-10-01 taurun: dist/omp deleted (ranch/tau tree rm -rf 02:17 MDT); fork cannot
# rebuild here (missing @ranch/tack monorepo sibling). Pinned launcher (upstream
# 18.3.0, same pin as ~/.local/bin/tau) restores the daemon. Revert to dist/omp
# when the fork builds again.
dir = "/home/toxic"
mise = false
retry = true
ready_cmd = "/home/toxic/sovereign/bin/tcp-probe 25111"
health_port = { port = 25111, interval = "30s", timeout = "5s", retries = 3 }
depends = ["gatehouse"]
# Every var here was checked against a `grep -rl` over the whole tau monorepo
# (node_modules excluded) plus config/tau/extensions. Three of the original
# eight were read by NOTHING and are gone:
#   PI_AGENT_DIR         0 readers. The real name is PI_CODING_AGENT_DIR
#                        (76 readers). It was silently a no-op.
#   PI_REASONING_LEVEL   0 readers. Thinking level comes from the
#                        `defaultThinkingLevel` config key, not the env.
#   PI_SUBAGENT_MODEL    0 readers — so `thinkingmachines/inkling` NEVER took
#                        effect on any subagent this daemon spawned.
# PI_CODING_AGENT_DIR is set here explicitly because it is the one var that
# decides which config.yml the engine reads (settings.ts:601), and a login
# shell that exports the config root instead of the agent dir loses the whole
# modelRoles/retry/extensions file. See ~/.bashrc for the full reasoning.
env = { PI_CONFIG_DIR = "/home/toxic/.tau", PI_CODING_AGENT_DIR = "/home/toxic/.tau/agent", PI_CODING_AGENT = "true", PI_OPENAI_STREAM_IDLE_TIMEOUT_MS = "120000", VANSROUTER_API_KEY = "local-sovereign" }
auto = ["start"]
