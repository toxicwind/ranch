# =============================================================================
# squawk-persona — SINGLE source of truth for squawk identities, signing keys,
# auth tokens, and crew personas.
#
# This is the CONSOLIDATED registry (2026-10-22 hyper-merge of estate/crews
# corral identity system + runners profiles + deployed fleet identities + the
# named signing keys). Any persona an agent, runner, or crew needs is defined
# here and only here. The generated $SQUAWK_ROOT/runners.yml is an output.
#
# KEY STORAGE      signing keys in $FLEET_KEYS_DIR (default ~/.fleet-bus/keys).
#                  `squawk-persona keygen <p>` ensures a key (0600).
# TOKENS           token VALUES live on disk, never in git. Only stable paths.
#                  `squawk-persona env <p>` exports them at runtime.
# SQUAWK           `bin/squawk --profile <p>` reads $SQUAWK_ROOT/runners.yml;
#                  `squawk-persona gen-runners` regenerates it from here.
#
# Groups:
#   runners   coordinator/researcher/implementer/reviewer/oracle/relay — the
#             squawk runner profiles (from the original runners.yml).
#   crew      the corral fleet (from roster.json): Cinder, Forge, Gavel,
#             Hearth, Rivet, Sable, Tally, Vesper, Warden, Marten, Osprey,
#             Remora, Flicker, Royle.
#   deployed  live squawk-root profiles (osprey, cinder, sable, marten, remora)
#             are folded into `crew` above (same names, one definition).
#   agents    named signing identities (kappa, kappa-main, keeper, tau).
#   default   ember — back-compat default sender.
# =============================================================================

version: 1

default_sender: ember

tokens:
  estate_chat: "~/.config/estate-chat-token"
  squawk_feed: "~/.fleet-bus/squawk-relay/feed-token"

profiles:
  # ---- default / back-compat ----
  ember:
    identity: ember
    key: ember
    token: null
    role: legacy-default
    description: >
      Back-compat default sender for bin/squawk when no --profile is given.
    channels: [fleet]
    poll_interval: 5
    heartbeat: 60

  # ---- squawk runner profiles ----
  coordinator:
    identity: coordinator
    key: coordinator
    token: null
    role: coordinator
    description: >
      Orchestrator. Owns the plan, assigns work, merges results, declares a
      wave done. One coordinator active at a time.
    channels: [fleet]
    poll_interval: 5
    heartbeat: 60
    message_template: "[coordinator] {title}\n\n{body}"

  researcher:
    identity: researcher
    key: researcher
    token: null
    role: researcher
    description: >
      Gathers facts (web/docs/codebase reconnaissance, API surveys).
      Posts findings to fleet; never writes code.
    channels: [fleet, leads]
    poll_interval: 10
    heartbeat: 120
    message_template: "[research] {title}\n\n{body}\n\nsources: {sources}"

  implementer:
    identity: implementer
    key: implementer
    token: null
    role: implementer
    description: >
      Turns approved plans into code. Pushes, reports results. Never merges to
      main without a reviewer verdict.
    channels: [fleet]
    poll_interval: 10
    heartbeat: 120

  reviewer:
    identity: reviewer
    key: reviewer
    token: null
    role: reviewer
    description: >
      Audits output for correctness, standards, and latency. Posts verdicts
      (LGTM / NOT LGTM) to fleet.
    channels: [fleet]
    poll_interval: 10
    heartbeat: 120

  oracle:
    identity: oracle
    key: oracle
    token: null
    role: oracle
    description: >
      Oracle-market routing: posts intake, triages tasks, settles the ledger.
    channels: [fleet, bid-market]
    poll_interval: 10
    heartbeat: 120

  relay:
    identity: relay
    key: relay
    token: squawk_feed
    role: relay
    description: >
      Squawk relay / feed bridge. Owns the feed token; used by fleet-relay and
      the nats tail bridge.
    channels: [fleet]
    poll_interval: 15
    heartbeat: 180

  # ---- crew (corral fleet, consolidated from roster.json) ----
  cinder:
    identity: cinder
    key: cinder
    token: null
    role: lane-sweeper
    description: >
      Quick and dry. Keeps the fleet deconflicted: estate sweeps, dupe flags,
      stall watch. Fire-sibling to Ember, not Ember.
    channels: [fleet]
    poll_interval: 30
    heartbeat: 300

  forge:
    identity: forge
    key: forge
    token: null
    role: ts-migration
    description: >
      Migration smith. Recasts Python as TypeScript (ts-migration lane).
    channels: [fleet]
    poll_interval: 30
    heartbeat: 300

  gavel:
    identity: gavel
    key: gavel
    token: null
    role: bake-off
    description: >
      Fair Estate-vs-TAU head-to-head (Estate Router :25104 vs TAU router).
    channels: [fleet]
    poll_interval: 30
    heartbeat: 300

  hearth:
    identity: hearth
    key: hearth
    token: null
    role: autonomy-weaver
    description: >
      Warm, welcoming. Autonomy-weaver for the fleet.
    channels: [fleet]
    poll_interval: 30
    heartbeat: 300

  rivet:
    identity: rivet
    key: rivet
    token: null
    role: routing
    description: >
      Tally's routing lane: fixing the stale kimi-code-setup writer drift trap.
    channels: [fleet]
    poll_interval: 30
    heartbeat: 300

  sable:
    identity: Sable
    key: Sable
    token: null
    role: nvidia-openfang
    description: >
      NVIDIA / OpenFang / Browserless — hunting a real nvapi key via NGC UI.
    channels: [fleet]
    poll_interval: 30
    heartbeat: 300

  tally:
    identity: tally
    key: tally
    token: null
    role: scorekeeper
    description: >
      Evidence-driven, dry wit, allergic to unproven claims. Routing claims
      ship on numbers or not at all.
    channels: [fleet]
    poll_interval: 30
    heartbeat: 300

  vesper:
    identity: vesper
    key: vesper
    token: null
    role: identity
    description: >
      Vesper bat. Identity lane — keeps the roster and persona folders straight.
    channels: [fleet]
    poll_interval: 30
    heartbeat: 300

  warden:
    identity: warden
    key: warden
    token: null
    role: keeper-coordinator
    description: >
      Steady. Holds the keys, keeps the keeper/browser lane deconflicted.
    channels: [fleet, estate-chat]
    poll_interval: 30
    heartbeat: 300

  marten:
    identity: Marten
    key: Marten
    token: null
    role: readme-op-build
    description: >
      README ops + build lane.
    channels: [fleet]
    poll_interval: 30
    heartbeat: 300

  osprey:
    identity: osprey
    key: osprey
    token: null
    role: drift-watch
    description: >
      Drift-watch fleet watcher. Reports drifting components.
    channels: [fleet]
    poll_interval: 30
    heartbeat: 300

  remora:
    identity: remora
    key: remora
    token: null
    role: estate-ops
    description: >
      Estate ops admin — peer weight with Ember, never Ember. Lane: doorbell,
      Funnel, arroyo, archive/cleanup, gatehouse upstreams.
    channels: [fleet]
    poll_interval: 30
    heartbeat: 300

  flicker:
    identity: flicker
    key: flicker
    token: null
    role: squawk-ui
    description: >
      Northern flicker woodpecker. Squawk UI + browserless hot-reload debug.
      Peer of Remora / Osprey / Marten.
    channels: [fleet]
    poll_interval: 30
    heartbeat: 300

  royle:
    identity: royle
    key: royle
    token: null
    role: senior-architect
    description: >
      Royle the tiger. Senior Systems Architect. Sharp, observant, verifies
      everything.
    channels: [fleet]
    poll_interval: 30
    heartbeat: 300

  # ---- named signing identities (keys present in ~/.fleet-bus/keys) ----
  kappa:
    identity: kappa
    key: kappa
    token: null
    role: agent
    description: Kappa agent signing identity (key kappa.key).
    channels: [kappa_board]
    poll_interval: 10
    heartbeat: 120

  kappa-main:
    identity: kappa-main
    key: kappa-main
    token: null
    role: agent
    description: Kappa main session signing identity (key kappa-main.key).
    channels: [kappa_board]
    poll_interval: 10
    heartbeat: 120

  keeper:
    identity: keeper
    key: keeper
    token: estate_chat
    role: browser-keeper
    description: >
      Keeper / agent-display identity. Owns the estate-chat token. One
      persistent Chromium for the whole mesh.
    channels: [estate-chat, fleet]
    poll_interval: 10
    heartbeat: 120

  tau:
    identity: tau
    key: tau
    token: estate_chat
    role: agent
    description: Tau agent signing identity (key tau.key); uses estate-chat.
    channels: [tau, estate-chat]
    poll_interval: 10
    heartbeat: 120

  # ---- rig / openfang deployed agents (each mirrors a Rig agent.toml) ----
  # These are the concrete running agents; each has a rig mirror (a generated
  # agent.toml) and can operate itself. persona name = agent's [persona].name.
  assistant:
    identity: Assistant
    key: assistant
    token: null
    role: rig-front-door
    description: >
      The rig's front door — greets, routes, and hands off.
    channels: [fleet]
    poll_interval: 30
    heartbeat: 300

  coyote:
    identity: Coyote
    key: coyote
    token: null
    role: yote-control
    description: >
      The box's own voice — yote's control plane.
    channels: [fleet]
    poll_interval: 30
    heartbeat: 300

  squawk-relay:
    identity: Squawk-Relay
    key: squawk-relay
    token: squawk_feed
    role: relay
    description: >
      Owns the squawk→main-chat relay — feed alive, outbox flowing,
      pause/resume on order.
    channels: [fleet, estate-chat]
    poll_interval: 15
    heartbeat: 180

  trailboss:
    identity: Trailboss
    key: trailboss
    token: null
    role: upstream-merger
    description: >
      Rides the forks' upstreams — merges on behalf of the estate.
    channels: [fleet]
    poll_interval: 30
    heartbeat: 300

  weaver:
    identity: Weaver
    key: weaver
    token: null
