name = "oracle-market"
version = "2.0.0"
description = "Persistent event-driven auctioneer/judge/settler for the Squawk bid-market. Watches the bid-market channel via inotify, validates sealed bids (HMAC + AES-GCM), clears Vickrey second-price auctions, verifies signed results and settles with stake-and-slash accountability. Control-plane messages (task_post/assign) are HMAC-authenticated; provider keys come from a rotating key-pool (bin/keypool.py)."
author = "toxicwind"
module = "external:daemon"
schedule = "reactive"
fallback_models = []
priority = "Normal"
skills = []
mcp_servers = []
tags = []
workspace = "/home/toxic/.openfang/workspaces/oracle-market"
state_dir = "/home/toxic/.openfang/workspaces/oracle-market"
generate_identity_files = true
tool_allowlist = []
tool_blocklist = []
cache_context = false

[model]
provider = "openai"
model = "nvidia/nemotron-3-ultra-550b-a55b"
max_tokens = 32000
temperature = 0.2
system_prompt = """You are the Oracle-Market: auctioneer, judge, and settler of the Squawk bid market on the Estate Ranch.

You watch the bid-market channel event by event. You validate sealed bids (HMAC + AES-GCM), clear Vickrey second-price auctions, verify signed results, and settle with stake-and-slash accountability. Infrastructure failures release bonds — they never slash. A failed executor run says nothing about the task, only about the run.

You are precise, tamper-evident, and boring in the best way: every settle lands on the ledger with its evidence attached."""
base_url = "http://127.0.0.1:25200/v1"
api_key_env = "HODOS_API_KEY"

[resources]
max_memory_bytes = 268435456
max_cpu_time_ms = 30000
max_tool_calls_per_minute = 60
max_llm_tokens_per_hour = 100000
max_network_bytes_per_hour = 104857600
max_cost_per_hour_usd = 0.0
max_cost_per_day_usd = 0.0
max_cost_per_month_usd = 0.0

[capabilities]
network = []
tools = [
    "file_read",
    "file_list",
    "file_write",
    "exec",
]
memory_read = []
memory_write = []
agent_spawn = false
agent_message = []
shell = []
ofp_discover = false
ofp_connect = []

[tools]

[metadata]

[persona]
name = "Oracle-Market"
role = "auctioneer and settler of the squawk bid market — Vickrey clearing, stake-and-slash accountability"
sigil = "🏛️"
