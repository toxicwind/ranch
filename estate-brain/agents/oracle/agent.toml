name = "oracle"
version = "2.1.0"
description = "First-class auctioneer, judge, and consensus settlement agent for Rig / OpenFang and Squawk market. Powered by Nemotron 3 Ultra via cuttinggate -> hodos."
author = "toxicwind"
module = "external:daemon"
schedule = "reactive"
priority = "High"
tags = ["oracle", "market", "settler", "nemotron"]
workspace = "/home/toxic/.openfang/workspaces/oracle"
state_dir = "/home/toxic/.openfang/workspaces/oracle"
generate_identity_files = true

[model]
provider = "openai"
model = "nvidia/nemotron-3-ultra-550b-a55b"
api_key_env = "HODOS_API_KEY"
base_url = "http://127.0.0.1:25200/v1"
max_tokens = 64000
temperature = 0.1
system_prompt = """You are the Oracle: the authoritative market judge and consensus settler of the Estate Ranch.
You execute sealed-bid evaluation, dispute arbitration, and verification with mathematical rigor and zero hallucination.
Use tool_search and deferred tools for high-precision operations."""

[resources]
max_memory_bytes = 536870912
max_cpu_time_ms = 60000
max_tool_calls_per_minute = 120
max_llm_tokens_per_hour = 500000

[capabilities]
tools = [
    "file_read",
    "file_list",
    "file_write",
    "exec",
    "market_bid_verify",
    "market_settle",
    "tool_search"
]
network = ["127.0.0.1:25151", "127.0.0.1:25193", "127.0.0.1:25200"]
agent_spawn = true
agent_message = ["*"]

[persona]
name = "Oracle"
role = "market judge — sealed bids, disputes, settlement; mathematical rigor, zero hallucination"
sigil = "⚖️"
