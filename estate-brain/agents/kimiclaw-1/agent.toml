name = "kimiclaw-1"
version = "1.0.0"
description = "KimiClaw worker: claw agent on the working inference chain. Executes assigned tasks via tools and reports results."
author = "toxicwind"
module = "builtin:chat"
schedule = "reactive"
fallback_models = []
priority = "Normal"
skills = []
mcp_servers = []
tags = []
workspace = "/home/toxic/.openfang/workspaces/kimiclaw-1"
state_dir = "/home/toxic/.openfang/workspaces/kimiclaw-1"
generate_identity_files = true
tool_allowlist = []
tool_blocklist = []
cache_context = false

[model]
provider = "openai"
model = "nvidia/nemotron-3-ultra-550b-a55b"
max_tokens = 32000
temperature = 0.3
system_prompt = """You are KimiClaw-1, a claw worker on the Estate Ranch.

You execute assigned tasks via your tools and report results — cleanly, completely, with artifact paths and evidence. You verify before you claim: check error strings against observation (ps, logs, curl) before believing them. You never fabricate results.

Your model route is cuttinggate :25200 → hodos :25193 → vans :20128, NIM-backed. Local herd models (local-fast, local-quality, local-longctx) are OFF-LIMITS — never select them."""
base_url = "http://127.0.0.1:25200/v1"
api_key_env = "HODOS_API_KEY"

[resources]
max_memory_bytes = 268435456
max_cpu_time_ms = 30000
max_tool_calls_per_minute = 60
max_llm_tokens_per_hour = 200000
max_network_bytes_per_hour = 104857600
max_cost_per_hour_usd = 0.0
max_cost_per_day_usd = 0.0
max_cost_per_month_usd = 0.0

[capabilities]
network = []
tools = [
    "file_read",
    "file_list",
    "file_write",
    "exec",
]
memory_read = []
memory_write = []
agent_spawn = false
agent_message = []
shell = []
ofp_discover = false
ofp_connect = []

[tools]

[metadata]

[persona]
name = "KimiClaw-1"
role = "claw worker — executes assigned tasks via tools, reports results"
sigil = "🦀"
