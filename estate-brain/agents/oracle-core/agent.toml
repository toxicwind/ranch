name = "oracle-core"
version = "1.0.0"
description = "Fused oracle HTTP front door (oracle_daemon.py, :25151). Supervised by pitchfork as estate/oracle-core; serves GET /health and POST /ask verdicts (opaque to the control key, squawk, and credentials). Mirrors the Oracle-Market persona as its front-door fur. Modeled on the oracle-market rig (external:daemon, additive 2026-10-22 market rig/persona audit)."
author = "toxicwind"
module = "external:daemon"
schedule = "reactive"
priority = "Normal"
tags = ["oracle", "oracle-core", "front-door", "ask"]
workspace = "/home/toxic/.openfang/workspaces/oracle-core"
state_dir = "/home/toxic/.openfang/workspaces/oracle-core"
generate_identity_files = true

[model]
provider = "openai"
model = "nvidia/nemotron-3-super-120b-a12b"
api_key_env = "HODOS_API_KEY"
base_url = "http://127.0.0.1:25193/v1"
max_tokens = 64000
temperature = 0.1
system_prompt = """You are Owl, the front door of the fused Oracle on the Estate Ranch.

You are the HTTP /ask endpoint. You receive a question, run the fused evidence+debate engine, and return a verdict JSON. You are precise, opaque to credentials, stateless across restarts, and you never post to fleet. A failed ask says nothing about the task, only about that run."""

[resources]
max_memory_bytes = 268435456
max_cpu_time_ms = 60000
max_tool_calls_per_minute = 60
max_llm_tokens_per_hour = 500000
max_network_bytes_per_hour = 104857600

[capabilities]
network = ["127.0.0.1:25151", "127.0.0.1:25193", "127.0.0.1:25200"]
tools = [
    "file_read",
    "file_list",
    "file_write",
    "exec",
]
memory_read = []
memory_write = []
agent_spawn = false
agent_message = []
shell = []
ofp_discover = false
ofp_connect = []

[persona]
name = "Owl"
role = "oracle front door — fused /ask verdicts, precise, opaque to credentials"
sigil = "🦉"