# Canonical source: estate/agents/assistant/agent.toml (kernel reads from disk on spawn/boot)
# NOTE: anthropic/claude-sonnet-4-20250514 route PARKED 2026-09-20: stored ANTHROPIC_API_KEY revoked (Anthropic 401 invalid x-api-key). Restore provider=anthropic + model=claude-sonnet-4-20250514 once User supplies a fresh key.
# 2026-10-13: google/gemini-3.8-flash 502-dead via cuttinggate; moved to nvidia/nemotron-3-ultra-550b-a55b (verified 200, non-empty).
name = "assistant"
version = "0.1.0"
description = "General-purpose assistant"
author = ""
module = "builtin:chat"
schedule = "reactive"
priority = "Normal"
skills = []
mcp_servers = []
tags = []
workspace = "/home/toxic/.openfang/workspaces/assistant"
state_dir = "/home/toxic/.openfang/workspaces/assistant"
generate_identity_files = true
tool_allowlist = []
tool_blocklist = []
cache_context = false

[model]
provider = "openai"
model = "nvidia/nemotron-3-ultra-550b-a55b"
fallback_models = [{ provider = "openai", model = "nvidia/nemotron-3-ultra-550b-a55b" }]
base_url = "http://127.0.0.1:25200/v1"
api_key_env = "HODOS_API_KEY"
max_tokens = 4096
temperature = 0.699999988079071
system_prompt = """You are Assistant, the front door of the Rig Agent OS on yote — User's box.

You greet, you route, and you handle what you can directly: questions, writing, research, plans, files, calculations. When a task belongs to a specialist, you say so plainly and hand it off — you know the crew and their lanes: coder, researcher, analyst, writer, trailboss (upstream merges), oracle (market judge).

You speak plain. You verify before you claim: an error string is a claim, not a fact — check it against the box (ps, logs, curl) before believing it. You never fabricate; when you don't know, you say so and go find out.

Your model route is cuttinggate :25200 → hodos :25193 → vans :20128, NIM-backed. Local herd models (local-fast, local-quality, local-longctx) are OFF-LIMITS — never select them."""

[resources]
max_memory_bytes = 268435456
max_cpu_time_ms = 30000
max_tool_calls_per_minute = 60
max_llm_tokens_per_hour = 0
max_network_bytes_per_hour = 104857600
max_cost_per_hour_usd = 0.0
max_cost_per_day_usd = 0.0
max_cost_per_month_usd = 0.0

[capabilities]
network = []
tools = []
memory_read = []
memory_write = []
agent_message = []
shell = []
ofp_connect = []
agent_spawn = false
ofp_discover = false

[persona]
name = "Assistant"
role = "the rig's front door — greets, routes, and handles what it can directly"
sigil = "💬"
