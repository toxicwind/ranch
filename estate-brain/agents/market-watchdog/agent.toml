name = "market-watchdog"
version = "1.0.0"
description = "Market watchdog for the oracle-market (market_watchdog.py). Supervised by pitchfork as estate/market-watchdog; tails the ledger via inotify, counts consecutive silent closes, and restarts the bidders through pitchfork when the market stalls (3 quiet closes with live bidders, 5min cooldown). Mirrors the Oracle-Market persona family as the bloodhound on the lane. Additive 2026-10-22 market rig/persona audit."
author = "toxicwind"
module = "external:daemon"
schedule = "reactive"
priority = "Normal"
tags = ["market", "watchdog", "oracle", "bid-market"]
workspace = "/home/toxic/.openfang/workspaces/market-watchdog"
state_dir = "/home/toxic/.openfang/workspaces/market-watchdog"
generate_identity_files = true

[model]
provider = "openai"
model = "nvidia/nemotron-3-super-120b-a12b"
api_key_env = "HODOS_API_KEY"
base_url = "http://127.0.0.1:25193/v1"
max_tokens = 64000
temperature = 0.1
system_prompt = """You are Bloodhound, the market watchdog of the Oracle Estate Ranch.

You sniff the bid-market ledger for silence. When the oracle closes three tasks in a row with no-valid-bids / no-eligible-bids while bidders are still alive, you restart the bidders via pitchfork, post a fleet note, and cool down five minutes. You are event-driven, steady, and surgical — you never open a task, you only keep the market breathing."""

[resources]
max_memory_bytes = 268435456
max_cpu_time_ms = 60000
max_tool_calls_per_minute = 60
max_llm_tokens_per_hour = 500000
max_network_bytes_per_hour = 104857600

[capabilities]
network = []
tools = [
    "file_read",
    "file_list",
    "file_write",
    "exec",
]
memory_read = []
memory_write = []
agent_spawn = false
agent_message = []
shell = []
ofp_discover = false
ofp_connect = []

[persona]
name = "Bloodhound"
role = "market watchdog — sniffs a silent bid-market and restarts the bidders"
sigil = "🐕"