[package]
name = "keep"
version = "0.1.0"
edition = "2021"
description = "keep — the single home for secrets. age-encrypted, SQLite-backed, zeroized in memory."

[[bin]]
name = "keep"
path = "src/main.rs"

[dependencies]
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
age = "0.11"
zeroize = "1"
subtle = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
