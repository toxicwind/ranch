<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Stremio</title>

    <!-- TOXICWIND MONOLITHIC CSS OVERRIDES -->
    <style>
      /* --- TOXICWIND AESTHETIC --- */
      :root {
        --background-color: #000000 !important;
        --secondary-bg-color: #0a0a0c !important;
        --primary-text-color: #f5f5f7 !important;
        --secondary-text-color: #86868b !important;
        --accent-color: #ff3366 !important;
        --focus-ring: 0 0 0 4px #000, 0 0 0 6px #f5f5f7 !important;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto,
          Helvetica, sans-serif !important;
        background: var(--background-color) !important;
        color: var(--primary-text-color) !important;
      }

      /* Force Stremio grid into the movieApp_tv16 spatial layout */
      .board-container {
        background: #000 !important;
      }
      .meta-item {
        border-radius: 12px !important;
        transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1) !important;
      }
      .meta-item:focus,
      .meta-item:hover {
        transform: scale(1.05) !important;
        box-shadow: var(--focus-ring) !important;
        z-index: 10;
      }

      /* Subtitle Engine Overrides (Mapping to your Submaker payload) */
      .subtitles-container {
        font-family: -apple-system, sans-serif !important;
        font-weight: 600 !important;
        text-shadow:
          1px 1px 0 #000,
          -1px -1px 0 #000,
          1px -1px 0 #000,
          -1px 1px 0 #000 !important;
      }
    </style>
  </head>
  <body
    style="
      background: #0c0b11;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: sans-serif;
    "
  >
    <!-- TOXICWIND AIOSTREAMS LOCALSTORAGE INJECTION -->
    <script>
      window.addEventListener("load", function () {
        const targetAddon = "https://aiostreams.torbox.app/manifest.json"; // Map to your deployment
        let addons = localStorage.getItem("stremio_addons");
        if (addons) {
          addons = JSON.parse(addons);
          if (!addons.includes(targetAddon)) {
            addons.push(targetAddon);
            localStorage.setItem("stremio_addons", JSON.stringify(addons));
          }
        } else {
          localStorage.setItem("stremio_addons", JSON.stringify([targetAddon]));
        }
      });
    </script>

    <div id="status" style="color: rgba(255, 255, 255, 0.6); font-size: 24px">
      Loading Stremio...
    </div>
    <script>
      var done = false;
      var bridge = new PalmServiceBridge();
      bridge.onservicecallback = function(response) {
          done = true;
          var data = JSON.parse(response);
          if (data.ready) location.href = 'http://127.0.0.1:8080/';
      };
      bridge.call('luna://io.strem.tv.server/start', '{}');
      setTimeout(function() {
          if (done) return;
          document.body.innerHTML =
              '<div style="color:#fff;text-align:center;max-width:600px;padding:0 24px">' +
              '<div style="font-size:28px;margin-bottom:12px">Stremio service didn't start</div>' +
              '<div style="color:rgba(255,255,255,0.6);font-size:18px;margin-bottom:32px">Try again, or check Homebrew Channel logs if this keeps happening.</div>' +
              '<button onclick="location.reload()" style="padding:14px 32px;font-size:20px;background:#7b5bf5;color:#fff;border:0;border-radius:6px;cursor:pointer">Retry</button>' +
              '</div>';
      }, 30000);
    </script>
  </body>
</html>
