services:
  aiostreams:
    image: ghcr.io/viren070/aiostreams:v2.30.5
    container_name: aiostreams
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    volumes:
      - ./data/aiostreams:/app/data
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - BASE_URL=${BASE_URL}
      - DATABASE_URI=sqlite://./data/db.sqlite
      - DEFAULT_TORBOX_API_KEY=${TORBOX_KEY:-}
      - DEFAULT_REALDEBRID_API_KEY=${RD_KEY:-}
      - DEFAULT_ALLDEBRID_API_KEY=${AD_KEY:-}
      - BUILTIN_ZILEAN_URL=https://zilean.elfhosted.com
      - BUILTIN_STREMTHRU_URL=https://stremthru.13377001.xyz
      - ADDON_PROXY=${ADDON_PROXY:-}
    networks:
      - toxicwind

  comet:
    image: ghcr.io/g0ldyy/comet:latest
    container_name: comet
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DATABASE_TYPE=sqlite
      - DATABASE_PATH=/app/data/comet.db
    volumes:
      - ./data/comet:/app/data
    networks:
      - toxicwind

  subtitle-proxy:
    build:
      context: ./src/subtitle
      dockerfile: Dockerfile
    container_name: subtitle-proxy
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-inclusionai/ling-3.0-flash:free}
      - CHUNK_SIZE=12000
      - TRANSLATION_TIMEOUT=720
    networks:
      - toxicwind

  xiu:
    image: ghcr.io/harlanc/xiu:latest
    container_name: xiu
    restart: unless-stopped
    ports:
      - "1935:1935"
      - "8081:8081"
      - "8082:8082"
    volumes:
      - ./data/xiu:/app/data
    networks:
      - toxicwind

  nginx:
    image: nginx:alpine
    container_name: toxicwind-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - aiostreams
      - comet
      - subtitle-proxy
    networks:
      - toxicwind

networks:
  toxicwind:
    driver: bridge
