[package]
name = "sovereign_web"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["fs","cors"] }
tower = "0.4"
reqwest = { version = "0.12", features = ["json","rustls-tls"] }
dotenvy = "0.15"
notify = "6"
toml = "0.8"
regex = "1"
