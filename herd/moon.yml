$schema: 'https://moonrepo.dev/schemas/project.json'
language: 'go'
layer: 'application'
# Known pre-existing failures (herd lane owns):
# - internal/router: 4 integration tests for the peer-health ejection flow
#   (TestPeerIntegration_*) — the health recording wiring was never completed.
# - race: TestValidCompletion — content-filter logic bug, unrelated.
tasks:
  build:
    command: 'go build ./...'
    inputs: ['**/*.go', 'go.mod', 'go.sum']
  test:
    command: 'go test ./...'
    inputs: ['**/*.go', 'go.mod', 'go.sum']
  lint:
    command: 'gofmt -l ./internal ./cmd'
    inputs: ['**/*.go']
