# =============================================================================
# Hooksmith gitleaks config — high precision, low false positives.
#
# Replaces the official 222-rule default config, which flagged test fixtures
# (fake node keys in *.test.ts), base64 image/font assets, and example keys —
# blocking legitimate work. See README.md for the full audit.
#
# Philosophy:
#   BLOCK only on high-confidence secret patterns (known key formats, PEM
#   blocks). Test files, fixtures, placeholder values, and generated assets
#   are NEVER findings. When in doubt the rule doesn't exist: GitHub's own
#   secret scanning is the backstop for anything exotic we miss.
# =============================================================================

title = "hooksmith"

# --- global path allowlist: these paths never contain real secrets ------------
[allowlist]
description = "tests, fixtures, docs examples, generated assets, lockfiles"
paths = [
    # tests and fixtures
    '''\.test\.[^.]+$''',
    '''\.spec\.[^.]+$''',
    '''_test\.[^.]+$''',
    '''(^|/)(test|tests|__tests__|spec|fixtures?)(/|$)''',
    '''\.snap$''',
    # explicit example / sample / template files
    '''\.(example|sample|template)$''',
    # generated / binary-ish assets: base64 blobs live here, not secrets
    '''(?i)\.(svg|png|jpe?g|gif|ico|webp|avif|woff2?|ttf|eot|otf|map|pdf)$''',
    # lockfiles: content hashes, not secrets
    '''(^|/)(package-lock\.json|bun\.lock|yarn\.lock|pnpm-lock\.yaml|Cargo\.lock|go\.sum)$''',
]

# --- rules: known secret formats only ----------------------------------------

[[rules]]
id = "aws-access-key"
description = "AWS access key ID"
regex = '''\bAKIA[0-9A-Z]{16}\b'''

[[rules]]
id = "github-token"
description = "GitHub personal access / OAuth / app / refresh token"
regex = '''\bgh[pousr]_[A-Za-z0-9_]{36}\b'''

[[rules]]
id = "private-key"
description = "PEM private key block"
regex = '''-----BEGIN (?:RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'''

[[rules]]
id = "stripe-live-key"
description = "Stripe live secret / restricted key"
regex = '''\b[rs]k_live_[A-Za-z0-9]{16,}\b'''

[[rules]]
id = "slack-token"
description = "Slack bot / user / app token"
regex = '''\bxox[baprs]-[A-Za-z0-9-]{10,}\b'''

[[rules]]
id = "generic-api-key"
description = "key/secret/token/password assigned a high-entropy value"
regex = '''(?i)(?:api[_-]?key|client[_-]?secret|auth[_-]?token|access[_-]?token|secret[_-]?key|password|passwd)\s*[:=]\s*['"]?([A-Za-z0-9_\-+/=]{24,})['"]?'''

# Rule-level allowlist: placeholder values are not secrets, even in real files.
# (Deliberately NOT applied to the key-format rules above: a committed
# AKIA... or ghp_... is always worth flagging, even if it says EXAMPLE —
# GitHub's own scanner flags those too.)
[rules.allowlist]
description = "placeholder / fake values are not secrets"
regexes = [
    '''(?i)^(test|testing|example|placeholder|fake|dummy|sample|changeme|redacted|password|secret|123456|qwerty|abc123)$''',
    '''(?i)\b(example|placeholder|fake|dummy|sample|changeme|redacted|test(ing)?)\b''',
    '''^(?:0123456789abcdef)+$''',
    '''^(a{8,}|0{8,}|x{8,}|X{8,}|-{8,}|_{8,})$''',
    '''^[xX]+$''',
    '''^0+$''',
]
