$schema: "https://moonrepo.dev/schemas/workspace.json"

# Ranch monorepo — moon task orchestration (maximal).
# Every animal/component is a first-class moon project. Tasks are polyglot
# (Bun/TS, Go, Python, Rust); pinned toolchains in toolchain.yml keep agent
# runs and CI reproducible.

projects:
  # Top-level component projects.
  - "*/moon.yml"
  # Nested sub-project graphs (barn, mesh, forge, squawk, tau, kappa).
  - "barn/*/moon.yml"
  - "mesh/*/moon.yml"
  - "forge/*/moon.yml"
  - "forge/*/*/moon.yml"
  - "squawk/*/moon.yml"
  - "tau/*/moon.yml"
  - "kappa/*/moon.yml"

vcs:
  provider: "github"
  defaultBranch: "main"

pipeline:
  cacheLifetime: "7 days"
  installDependencies: true
