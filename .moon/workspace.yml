$schema: 'https://moonrepo.dev/schemas/workspace.json'

# Ranch monorepo — moon task orchestration.
# Every animal is a first-class moon project. Tasks are polyglot
# (Bun/TS, Go, Python, Rust); pinned toolchains in toolchain.yml
# keep agent runs and CI reproducible.

projects:
  # File-matched globs (moon v2.5+): only dirs containing a moon.yml become projects.
  - '*/moon.yml'
  - 'barn/*/moon.yml'
  - 'flock/*/moon.yml'

vcs:
  provider: 'github'
  defaultBranch: 'main'

pipeline:
  cacheLifetime: '7 days'
  installDependencies: true
