$schema: 'https://moonrepo.dev/schemas/workspace.json'

# Ranch monorepo — moon task orchestration (maximal).
# Every animal/component is a first-class moon project. Tasks are polyglot
# (Bun/TS, Go, Python, Rust); pinned toolchains in toolchain.yml keep agent
# runs and CI reproducible.

projects:
  # Top-level component projects.
  - '*/moon.yml'
  # Nested sub-project graphs (mesh, flock, barn, forge, squawk, tau, campfire).
  - 'barn/*/moon.yml'
  - 'flock/*/moon.yml'
  - 'mesh/*/moon.yml'
  - 'mesh/*/*/moon.yml'
  - 'forge/*/moon.yml'
  - 'squawk/*/moon.yml'
  - 'tau/*/moon.yml'
  - 'campfire/*/moon.yml'
  # Explicit re-scans if a project is added mid-tree.
  - '*/projects/*/moon.yml'

vcs:
  provider: 'github'
  defaultBranch: 'main'

workspace:
  # Tag all component roots as 'ranch' for cross-cutting queries.
  tags:
    - 'ranch'
    - 'component'
  # Enable extension / toolchain sync so moon provisions correctly.
  syncToolchainConfig: true

pipeline:
  cacheLifetime: '7 days'
  installDependencies: true
  # Rerun affected tasks + dependents across the whole component graph.
  retryCount: 2

constraints:
  enforceProjectTypeRelationships: false
  enforceProjectDependencyRelationships: false