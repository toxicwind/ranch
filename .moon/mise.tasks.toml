# .moon/mise.tasks.toml — ranch multi-repo (meta) tasks, first-class.
# Every ranch component is an independent repo, coordinated by `meta`
# (the `gitkb/meta` manifest tool — repos as peers, not submodules hierarchy).
# Generated from .gitmodules via `bun toolkit/gen-meta-manifest.ts`.

[tasks.ranch-status]
description = "Per-repo state across all 214 components"
run = "meta git status --parallel"

[tasks.ranch-sync]
description = "Clone missing + pull all repos (multi-repo manifest sync)"
run = "meta exec -- 'git pull --rebase --quiet'"

[tasks.ranch-exec]
description = "Run a command across every component repo (meta exec)"
run = "meta exec -- $CMD"

[tasks.ranch-list]
description = "List the full component map (path, repo, state)"
run = "meta context"

[tasks.ranch-manifest]
description = "Regenerate .meta.yaml from .gitmodules"
run = "bun toolkit/gen-meta-manifest.ts"