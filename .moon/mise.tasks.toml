# .moon/mise.tasks.toml — ranch multi-repo (meta) tasks, first-class.
# Every ranch component is an independent repo, coordinated by `meta`
# (the `gitkb/meta` manifest tool — repos as peers, not submodules hierarchy).
# Generated from .gitmodules via `bun toolkit/gen-meta-manifest.ts`.

[tasks.ranch-status]
description = "Per-repo state across all 214 components"
run = "meta git status --parallel"

[tasks.ranch-sync]
description = "Clone missing + pull all repos (multi-repo manifest sync)"
run = "meta exec -- 'git pull --rebase --quiet'"

[tasks.ranch-exec]
description = "Run a command across every component repo (meta exec)"
run = "meta exec -- $CMD"

[tasks.ranch-list]
description = "List the full component map (path, repo, state)"
run = "meta context"

[tasks.ranch-manifest]
description = "Regenerate .meta.yaml from .gitmodules"
run = "bun toolkit/gen-meta-manifest.ts"

# pitchfork (jdx/pitchfork) — the estate's daemon supervisor → moon through mise.
# Configs: /home/toxic/estate/pitchfork.toml + per-project pitchfork.toml.
# Daemon list: `pitchfork --help` (list/status/restart/start/stop/logs/supervisor).

[tasks.pitchfork-list]
description = "List all supervised daemons across merged configs"
run = "pitchfork list"

[tasks.pitchfork-status]
description = "Displays the status of a daemon"
run = "pitchfork status"

[tasks.pitchfork-restart]
description = "Restarts a daemon (stop then start)"
run = "pitchfork restart"

[tasks.pitchfork-supervisor]
description = "Start, stop, or check the pitchfork supervisor daemon"
run = "pitchfork supervisor status"

[tasks.pitchfork-logs]
description = "Displays logs for daemon(s)"
run = "pitchfork logs"