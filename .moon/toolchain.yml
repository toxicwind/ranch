$schema: 'https://moonrepo.dev/schemas/toolchain.json'

# Pinned toolchains — moon provisions these via proto so every agent
# and CI run builds with the same compilers. Versions match the yote
# estate as of 2026-09-30.
#
# Python is deliberately NOT pinned here: the estate python (3.12.13
# via mise) already carries the test deps (pytest), and a moon-managed
# python would be an isolated interpreter without them. Revisit when
# the python projects move to uv-managed environments.

bun:
  version: '1.4.4'

node:
  version: '22.12.0'

# go is deliberately NOT pinned here: moon 2.x toolchain schema rejects a bare
# `go` block, and the estate already pins go via mise (config/mise.toml).
# Revisit if moon adds native go toolchain support.

rust:
  version: '1.89.0'
