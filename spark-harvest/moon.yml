$schema: 'https://moonrepo.dev/schemas/project.json'
language: 'typescript'
layer: 'automation'
# Incremental GitHub harvester for muse-spark keywords.
# Writes deduped results into /home/toxic/estate/hatch/spark-harvest/.
# Corpus: /home/toxic/estate/hatch/spark-corpus/.
# Fork: toxicwind/meta-muse-spark-api (profile commit 83edf43).
tasks:
  harvest:
    command: 'bun harvest.ts'
    inputs: ['harvest.ts']
  verify:
    script: 'bun harvest.ts --dry-run && bun verify.ts'
    inputs: ['harvest.ts', 'verify.ts', 'profile.json']
  test:
    command: 'bun test'
    inputs: ['src/**/*', 'profile.json']
