# nvidia-persistenced self-heal drop-in
# Source of truth: sovereign/projects/yote/host/etc/systemd/system/nvidia-persistenced.service.d/override.conf
#
# Root cause 2026-09-21: on the 2026-09-20 bore-kernel repair boot this unit
# started at 21:39:11 MDT, ~7 min before /dev/nvidia* existed (bore nvidia
# driver was installed mid-boot; initramfs rebuilt 21:46:34). The stock
# NVIDIA unit has no restart policy, so it stayed failed until noticed.
#
# NOTE: StartLimitBurst/StartLimitIntervalSec belong under [Unit] on
# systemd >= 230 (verified 261.3 on yote) - systemd-analyze warns and
# ignores them under [Service].
[Unit]
StartLimitBurst=5
StartLimitIntervalSec=300

[Service]
Restart=on-failure
RestartSec=15
