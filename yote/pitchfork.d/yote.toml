# projects/yote — project-owned daemon manifest. Source of truth for 'yote'.
# Owned by the projects/yote project; the parent only composes it.


[daemons.yote]
health_http = { url = "http://127.0.0.1:25102/health", interval = "30s", timeout = "5s", retries = 3 }
port = 25102
run = "exec bun run src/yote.ts"
dir = "projects/yote"
mise = false
retry = true
ready_http = "http://127.0.0.1:25102/health"
depends = ["gatehouse"]
auto = ["start"]
