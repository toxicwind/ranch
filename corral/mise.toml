# Sovereign Corral — Multi-Agent Engineering & Ticket Orchestration
[tools]
bun = "1.4.2"
node = "22.12.0"

[env]
_.file = "../../config/ports.env"

[tasks]
cli = "bun run src/cli/index.ts"
typecheck = "bun x tsc --noEmit"
test = "bun test tests/"
help = "bun run src/cli/index.ts --help"
install = "bun install"
