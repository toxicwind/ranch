# ranch/.meta.yaml — the multi-repo manifest (meta 0.2.22+).
# Generated from the peer model (meta-themes + on-disk standalone clones) —
# repos are PEERS, not submodules: each stays an independent clone with its
# own history. Sync with
#   meta git update       # clone missing + pull all
#   meta git status       # per-repo state
#   meta exec '<cmd>'     # run any command across every component
# Regenerate: bun toolkit/gen-meta-manifest.ts
# CATEGORIZED by theme (DATA-DRIVEN from .meta-themes.yaml — see
# toolkit/THEME-DESIGN.md §2 for the bounded-context holders; "general"
# is the honest fallback). NO .gitmodules dependency (submodule doctrine is
# retired — repos are peers). Edit the DATA, never this generator.

