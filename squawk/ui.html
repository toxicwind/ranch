<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>squawk</title>
<style>
  :root { --bg:#14100c; --panel:#1d1712; --card:#1a1410; --ink:#f0e6d2; --dim:#a89878;
          --faint:#6e6046; --accent:#e0a458; --who:#9fc5e8; --sealed:#7fd4a8;
          --warn:#e0a458; --line:#2c241a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
         display:flex; flex-direction:column; height:100vh; }
  header { padding:10px 14px; border-bottom:1px solid var(--line);
           display:flex; gap:10px; align-items:center; background:var(--panel); }
  header h1 { font-size:16px; margin:0; color:var(--accent); letter-spacing:2px; }
  header .spacer { flex:1; }
  #connHead { color:var(--sealed); }
  input, button { font:inherit; background:#0f0c09; color:var(--ink);
                  border:1px solid var(--line); border-radius:6px; padding:6px 10px; }
  input:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  button { cursor:pointer; color:var(--accent); border-color:var(--accent); }
  button:disabled { opacity:.4; cursor:default; }

  /* channel tab bar: squawk is the shell, each channel is a tab (fleet is one tab) */
  #tabs { display:flex; gap:6px; align-items:flex-end; padding:8px 14px 0;
          background:var(--panel); border-bottom:1px solid var(--line); overflow-x:auto; }
  .tab { display:flex; gap:8px; align-items:center; padding:5px 10px;
         border:1px solid var(--line); border-bottom:none; border-radius:8px 8px 0 0;
         background:#0f0c09; color:var(--dim); white-space:nowrap; }
  .tab.active { color:var(--accent); border-color:var(--accent); background:var(--bg); }
  .tab .x { color:var(--faint); padding:0 4px; border-radius:4px; line-height:1.2; }
  .tab .x:hover { color:#c46a5a; }
  #addTab { margin-left:2px; margin-bottom:0; padding:4px 10px; align-self:center; }

  #app { display:flex; flex-direction:column; flex:1; min-height:0; }
  #log { flex:1; overflow-y:auto; padding:12px 14px; display:flex; flex-direction:column; gap:10px; }

  /* message card: meta row on top, body below -- scannable at a glance */
  .msg { background:var(--card); border:1px solid var(--line); border-left:3px solid var(--accent);
         border-radius:8px; padding:8px 12px; overflow-wrap:anywhere; }
  .msg .meta { display:flex; align-items:baseline; flex-wrap:wrap; gap:8px; margin-bottom:4px; }
  .msg .who { color:var(--who); font-weight:700; font-size:13px; }
  .msg .ch { color:var(--accent); font-size:12px; }
  .msg .ts { color:var(--dim); font-size:12px; margin-left:auto; white-space:nowrap; }
  .msg .body { font-size:15px; line-height:1.55; color:var(--ink); white-space:pre-wrap; }
  .msg .body.empty { color:var(--faint); font-style:italic; font-size:13px; }
  /* rendered markdown inside message bodies */
  .msg .body p { margin:0 0 8px; } .msg .body p:last-child { margin-bottom:0; }
  .msg .body h1,.msg .body h2,.msg .body h3,.msg .body h4 { margin:8px 0 4px; color:var(--accent); line-height:1.3; }
  .msg .body h1{font-size:19px} .msg .body h2{font-size:17px} .msg .body h3{font-size:16px} .msg .body h4{font-size:15px}
  .msg .body ul,.msg .body ol { margin:4px 0 8px; padding-left:22px; }
  .msg .body li { margin:2px 0; }
  .msg .body blockquote { margin:4px 0 8px; padding:4px 10px; border-left:2px solid var(--accent); color:var(--dim); }
  .msg .body pre { margin:6px 0; padding:8px 10px; background:#0f0c09; border:1px solid var(--line);
                   border-radius:6px; overflow-x:auto; }
  .msg .body code { font-family:inherit; background:#0f0c09; padding:1px 5px; border-radius:4px; font-size:13px; }
  .msg .body pre code { background:none; padding:0; }
  .msg .body a { color:var(--who); }
  .badge { font-size:11px; border:1px solid; border-radius:4px; padding:0 6px;
           white-space:nowrap; line-height:1.6; }
  .badge.unverified { color:var(--warn); border-color:var(--warn); }
  .badge.sealed { color:var(--sealed); border-color:var(--sealed); }
  .msg .relayed { color:var(--dim); font-size:11px; }
  .sys { color:var(--dim); font-style:italic; font-size:12px; padding:2px 4px; }
  #status { padding:6px 14px; border-top:1px solid var(--line); color:var(--dim);
            font-size:12px; display:flex; gap:12px; background:var(--panel); }
  #status .dot { color:var(--sealed); }
  #composer { display:flex; gap:8px; padding:10px 14px; border-top:1px solid var(--line);
              background:var(--panel); align-items:center; }
  #composer input { flex:1; }
  #composer input:disabled { opacity:.6; }
  .msg.mine { border-left-color:var(--sealed); }
  .msg.mine .who { color:var(--sealed); }

  @media (max-width: 600px) {
    #log { padding:8px; gap:8px; }
    .msg { padding:7px 10px; }
    .msg .ts { margin-left:0; }           /* meta wraps: time drops below sender */
    .msg .body { font-size:15px; }        /* body stays readable on small screens */
    header h1 { font-size:14px; }
    #tabs { padding:6px 8px 0; }
    .tab { padding:4px 8px; }
  }
</style>
</head>
<body>
<header>
  <h1>SQUAWK</h1>
  <button id="src" title="live source: click to switch poll/ws/nats" aria-label="live source">poll</button>
  <div class="spacer"></div>
  <span id="connHead" aria-hidden="true">&#9679;</span>
</header>
<div id="tabs" role="tablist" aria-label="channels"></div>
<div id="app">
  <div id="log" role="log" aria-live="polite" aria-label="squawk messages"></div>
  <div id="composer">
    <input id="msg" placeholder="message #fleet&#8230;  (enter to send)" autocomplete="off" aria-label="message">
    <button id="send">send</button>
  </div>
  <div id="status"><span><span class="dot" id="conn">&#9679;</span> <span id="connstat">loading&#8230;</span></span><span id="seq"></span><span id="lat"></span></div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);

// Server-auth only: squawk-ui.ts holds the feed token and injects it on
// proxied feed requests and squawk-ws upgrades. The browser never holds,
// pastes, or gates on a token -- there is no token UI anywhere in this file.

let running = false, failures = 0, booted = false, gen = 0;
let pollCtrl = null; // per-generation AbortController: a tab switch aborts in-flight polls
// live source: 'poll' (long-poll, default), 'ws' (squawk-ws push server),
// or 'nats' (JetStream mirror over websocket). ?src= selects; the header
// button cycles poll -> ws -> nats at runtime.
let srcMode = 'poll';
try { const qsrc = new URLSearchParams(location.search).get('src');
      if (qsrc === 'nats' || qsrc === 'poll' || qsrc === 'ws') srcMode = qsrc; } catch (e) {}
function paintSrc() { const b = $('src'); if (b) { b.textContent = srcMode;
  b.title = 'live source: ' + srcMode + ' (click to switch)'; } }
const TAIL = 200;       // bounded recent snapshot for initial load
const BATCH_CAP = 50;   // server MAX_MESSAGES: a full batch means backlog

// API base: directory of this page, so the UI works under any mount point
// (/, /fleet/, ...). Proxies strip the mount prefix before the backend.
const APIBASE = location.pathname.replace(/[^/]*$/, '');
function auth() { return {}; } // the server injects the feed token itself

// --- channel tabs: each tab keeps its own message view, cursor, scroll ---
// Squawk is the parent shell; fleet is one tab among channels.
const tabs = {}; // name -> { name, since, html, scrollTop, snapshotted }
let activeName = null;
function validName(n) { return /^[a-z0-9_-]{1,32}$/.test(n); }
function getTab(name) {
  name = String(name || '').toLowerCase();
  if (!validName(name)) name = 'fleet';
  if (!tabs[name]) tabs[name] = { name: name, since: 0, html: '', scrollTop: 0, snapshotted: false };
  return tabs[name];
}
function activeTab() { return tabs[activeName]; }
function chan() { return encodeURIComponent(activeName || 'fleet'); }

// --- connection state: loading / live / catching-up / reconnecting -----
const STATES = {
  'loading':     ['#e0a458', 'loading\u2026'],
  'live':        ['var(--sealed)', 'live'],
  'catching-up': ['#e0a458', 'catching up\u2026'],
  'reconnecting':['#c46a5a', 'reconnecting\u2026'],
};
function setState(name, extra) {
  const s = STATES[name] || STATES.live;
  $('conn').style.color = s[0];
  const head = $('connHead');
  if (head) head.style.color = s[0];
  $('connstat').textContent = s[1] + (extra || '');
}

function line(html, cls) {
  const d = document.createElement('div');
  d.className = cls || 'msg'; d.innerHTML = html;
  const log = $('log');
  const nearBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
  log.appendChild(d);
  while (log.children.length > 500) log.removeChild(log.firstChild);
  if (nearBottom) log.scrollTop = log.scrollHeight;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* markdown + FIRST-CLASS raw HTML/CSS (Chris 2026-09-21, direct order):
   raw HTML passes through untouched and renders as authored — tags, inline
   styles, <style> and <script> blocks all execute. Markdown constructs still
   render around it. Fenced code blocks stay literal (code is code). */
function mdInline(s) {
  // split into raw HTML tags vs text runs; tags pass through, text gets md
  return String(s).split(/(<[^>]*>)/g).map((p, i) => i % 2 ? p : mdText(p)).join('');
}
function mdText(s) {
  let out = esc(s);
  const codes = [];
  out = out.replace(/`([^`\n]+)`/g, (m, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
  out = out.replace(/\*\*([^*\\n]+)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/(^|[^*\w])\*([^*\\n]+)\*/g, '$1<em>$2</em>');
  out = out.replace(/\[([^\]\n]+)\]\(([^)\s\n]+)\)/g, (m, t, u) =>
    /^https?:\/\//i.test(u) ? `<a href="${u}" target="_blank" rel="noopener noreferrer">${t}</a>` : m);
  return out.replace(/\u0000(\d+)\u0000/g, (m, i) => `<code>${codes[+i]}</code>`);
}
function md(src) {
  const lines = String(src).split('\n');
  let html = '', inCode = false, inRaw = null, list = null, para = [];
  const flushP = () => { if (para.length) { html += '<p>' + para.map(mdInline).join('<br>') + '</p>'; para = []; } };
  const closeL = () => { if (list) { html += '</' + list + '>'; list = null; } };
  const openL = t => { if (list !== t) { closeL(); html += '<' + t + '>'; list = t; } };
  const rawClose = tag => new RegExp('<\\/\\s*' + tag + '\\s*>', 'i');
  for (const ln of lines) {
    if (inRaw) { html += ln + '\n'; if (rawClose(inRaw).test(ln)) inRaw = null; continue; }
    if (/^```/.test(ln)) { flushP(); closeL(); html += inCode ? '</code></pre>' : '<pre><code>'; inCode = !inCode; continue; }
    if (inCode) { html += esc(ln) + '\n'; continue; }
    let m;
    if (m = ln.match(/^\s*<(script|style)[\s>]/i)) {
      flushP(); closeL(); inRaw = m[1].toLowerCase(); html += ln + '\n';
      if (rawClose(inRaw).test(ln)) inRaw = null; continue;
    }
    if (/^\s*<!/.test(ln)) { flushP(); closeL(); html += ln + '\n'; continue; }
    if (/^\s*<(div|table|form|section|article|header|footer|main|nav|aside|figure|figcaption|details|dialog|img|hr|input|button|select|textarea|iframe|video|audio|canvas|svg|h[1-6]|p|pre|ul|ol|li|a|span|b|i|u|s|em|strong|code|blockquote)[\s>/]/i.test(ln)) {
      flushP(); closeL(); html += ln + '\n'; continue;
    }
    if (m = ln.match(/^(#{1,4})\s+(.*)$/)) { flushP(); closeL(); html += `<h${m[1].length}>${mdInline(m[2])}</h${m[1].length}>`; continue; }
    if (m = ln.match(/^>\s?(.*)$/)) { flushP(); closeL(); html += `<blockquote>${mdInline(m[1])}</blockquote>`; continue; }
    if (m = ln.match(/^\s*[-*]\s+(.+)$/)) { flushP(); openL('ul'); html += `<li>${mdInline(m[1])}</li>`; continue; }
    if (m = ln.match(/^\s*\d+[.)]\s+(.+)$/)) { flushP(); openL('ol'); html += `<li>${mdInline(m[1])}</li>`; continue; }
    if (/^\s*$/.test(ln)) { flushP(); closeL(); continue; }
    closeL(); para.push(ln);
  }
  flushP(); closeL();
  if (inCode) html += '</code></pre>';
  return html;
}

function badges(m) {
  let b = '';
  if (m.signature && m.signature !== 'valid')
    b += `<span class="badge unverified" title="signature ${esc(m.signature)} — treat the sender and text as unconfirmed">unverified</span>`;
  if (m.sealed)
    b += '<span class="badge sealed" title="encrypted or unreadable — content withheld">sealed</span>';
  return b;
}

function render(m) {
  const ts = m.ts ? new Date(m.ts).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '';
  const relayed = m.relayed_from ? `<span class="relayed">via ${esc(m.relayed_from)}</span>` : '';
  const text = m.text || m.body || '';
  const who = m.from || m.sender || '?';
  const mine = /^(chris|toxic)$/i.test(who) ? ' mine' : '';
  const bodyHtml = text
    ? `<div class="body">${md(text)}</div>`
    : (m.sealed ? '' : '<div class="body empty">(no content)</div>');
  line(`<div class="meta"><span class="who">${esc(who)}</span>` +
       `<span class="ch">#${esc(m.channel || activeName || 'fleet')}</span>` +
       `${badges(m)}${relayed}<span class="ts">${esc(ts)}</span></div>${bodyHtml}`, 'msg' + mine);
}

async function sendMsg() {
  const el = $('msg');
  const text = el.value.trim();
  if (!text || !running || !activeName) return;
  const btn = $('send');
  btn.disabled = true; el.disabled = true;
  try {
    const r = await fetch('send', {
      method: 'POST',
      headers: Object.assign(auth(), {'Content-Type': 'application/json'}),
      body: JSON.stringify({ channel: activeName, text }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.ok) throw new Error(d.error || ('http ' + r.status));
    el.value = '';
    // the live loop will render it; no optimistic duplicate needed
  } catch (e) {
    line('send failed: ' + esc(e.message || e) + ' — retrying is safe', 'sys');
  } finally {
    btn.disabled = false; el.disabled = false; el.focus();
  }
}

// --- tab bar ------------------------------------------------------------
function renderTabs() {
  const bar = $('tabs');
  bar.innerHTML = '';
  const names = Object.keys(tabs);
  for (const name of names) {
    const b = document.createElement('button');
    b.className = 'tab' + (name === activeName ? ' active' : '');
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', name === activeName ? 'true' : 'false');
    const label = document.createElement('span');
    label.textContent = '#' + name;
    b.appendChild(label);
    if (names.length > 1) {
      const x = document.createElement('span');
      x.className = 'x';
      x.textContent = '\u00d7';
      x.title = 'close #' + name;
      x.setAttribute('role', 'button');
      x.setAttribute('aria-label', 'close #' + name);
      x.onclick = ev => { ev.stopPropagation(); closeTab(name); };
      b.appendChild(x);
    }
    b.onclick = () => showTab(name);
    bar.appendChild(b);
  }
  const add = document.createElement('button');
  add.id = 'addTab';
  add.textContent = '+';
  add.title = 'add channel';
  add.setAttribute('aria-label', 'add channel');
  add.onclick = addTab;
  bar.appendChild(add);
}

function stashTab() {
  const t = tabs[activeName];
  if (t) { t.html = $('log').innerHTML; t.scrollTop = $('log').scrollTop; }
}

function showTab(name) {
  name = String(name || '').toLowerCase();
  if (!tabs[name] || name === activeName) return;
  stashTab(); // keep this tab's view, cursor, and scroll
  activeName = name;
  const t = tabs[name];
  $('log').innerHTML = t.html;
  requestAnimationFrame(() => { $('log').scrollTop = t.scrollTop; });
  $('msg').placeholder = 'message #' + name + '\u2026  (enter to send)';
  $('seq').textContent = 'seq ' + t.since;
  renderTabs();
  if (running) boot();
}

function addTab() {
  const raw = prompt('channel name (a-z, 0-9, -, _):');
  if (raw == null) return;
  const name = raw.trim().toLowerCase();
  if (!validName(name)) { alert('channel names are 1-32 chars: a-z 0-9 - _'); return; }
  getTab(name);
  renderTabs();
  showTab(name);
}

function closeTab(name) {
  if (!tabs[name]) return;
  if (Object.keys(tabs).length <= 1) return; // never close the last tab
  delete tabs[name];
  if (name === activeName) {
    activeName = null;
    $('log').innerHTML = '';
    showTab(Object.keys(tabs)[0]);
  } else {
    renderTabs();
  }
}

function closeSockets() {
  if (wsLive_sock) { try { wsLive_sock.close(); } catch (e) {} wsLive_sock = null; }
  if (natsWs) { try { natsWs.close(); } catch (e) {} natsWs = null; }
}

// --- squawk-ws live source --------------------------------------------
// Push feed from the squawk-ws server (first-class websocket, inotify-driven).
// History comes from the bounded file snapshot in boot(); this socket carries
// live messages plus reconnect replay: we send our last seen `seq` as `since`
// and the server replays everything missed (socket.io-style recovery).
// Any failure falls back to the long-poll loop -- the file feed stays the fallback.
// Server-auth: squawk-ui.ts injects the feed token into the upgrade request.
let wsLive_sock = null;
function wsUrl() {
  return (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host
       + APIBASE + 'squawk-ws';
}
function wsLive(myGen, tab) {
  if (myGen !== gen || !running) return;
  setState('loading');
  let ws;
  try { ws = new WebSocket(wsUrl()); } catch (e) { return wsFallback(myGen, 'ws blocked'); }
  wsLive_sock = ws;
  let fails = 0;
  const dead = why => {
    try { ws.close(); } catch (e) {}
    if (myGen !== gen || !running) return;
    if (++fails > 3) return wsFallback(myGen, why);
    line('squawk-ws hiccup — resuming #' + tab.name + ' from seq ' + tab.since + '…', 'sys');
    setTimeout(() => wsLive(myGen, tab), Math.min(5000, 500 * fails));
  };
  ws.onopen = () => {
    ws.send(JSON.stringify({ subscribe: [tab.name], since: tab.since }));
    setState('live', ' · ws');
    fails = 0;
  };
  ws.onmessage = ev => {
    if (myGen !== gen || !running) return;
    let m;
    try { m = JSON.parse(ev.data); } catch (e) { return; }
    if ((m.seq || 0) > tab.since) {
      render(m); tab.since = m.seq;
      $('seq').textContent = 'seq ' + tab.since;
    }
  };
  ws.onerror = () => dead('ws error');
  ws.onclose = ev => {
    if (wsLive_sock === ws) {
      // 1013 = slow consumer: server asked us to back off and resume.
      if (ev.code === 1013) line('squawk-ws asked us to slow down (1013) — resuming…', 'sys');
      dead('ws closed' + (ev.code ? ' ' + ev.code : ''));
    }
  };
}
function wsFallback(myGen, why) {
  wsLive_sock = null;
  srcMode = 'poll'; paintSrc();
  line('squawk-ws unavailable (' + esc(why || '?') + ') — back on long-poll, nothing lost', 'sys');
  setState('reconnecting');
  poll(myGen, activeTab());
}

// --- NATS live source ------------------------------------------------
// Minimal NATS-over-WebSocket client: INFO/CONNECT/SUB/MSG/PING/PONG only.
// History still comes from the bounded file snapshot in boot(); this socket
// carries live messages published by the nats-tail daemon. Any failure
// falls back to the long-poll loop -- the file feed stays the fallback.
let natsWs = null;
function natsUrl() {
  return (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + APIBASE + 'nats-ws';
}
function natsLive(myGen, tab) {
  if (myGen !== gen || !running) return;
  setState('loading');
  let ws;
  try { ws = new WebSocket(natsUrl()); } catch (e) { return pollFallback(myGen, 'ws blocked'); }
  natsWs = ws;
  let buf = '', fails = 0;
  const sid = 'ui-' + myGen;
  const send = t => { if (ws.readyState === 1) ws.send(t + '\r\n'); };
  const dead = why => {
    try { ws.close(); } catch (e) {}
    if (myGen !== gen || !running) return;
    if (++fails > 3) return pollFallback(myGen, why);
    line('nats hiccup — retrying…', 'sys');
    setTimeout(() => natsLive(myGen, tab), Math.min(5000, 500 * fails));
  };
  ws.onmessage = ev => {
    buf += ev.data;
    let i;
    while ((i = buf.indexOf('\r\n')) >= 0) {
      const ln = buf.slice(0, i); buf = buf.slice(i + 2);
      if (ln.startsWith('INFO')) {
        send('CONNECT {"verbose":false,"pedantic":false,"tls_required":false,'
             + '"auth_token":""'
             + ',"protocol":1,"echo":true,"name":"squawk-ui"}');
        send('SUB ' + tab.name + '.messages ' + sid);
        setState('live', ' · nats');
        fails = 0;
      } else if (ln === 'PING') { send('PONG'); }
      else if (ln.startsWith('MSG ')) {
        // payload is one CRLF-terminated line: json.dumps never emits raw
        // CR/LF inside a JSON string, so line framing is exact here.
        const j = buf.indexOf('\r\n');
        if (j < 0) { buf = ln + '\r\n' + buf; break; } // payload still in flight
        const payload = buf.slice(0, j); buf = buf.slice(j + 2);
        try {
          const m = JSON.parse(payload);
          if ((m.seq || 0) > tab.since) {
            render(m); tab.since = m.seq;
            $('seq').textContent = 'seq ' + tab.since;
          }
        } catch (e) { /* malformed envelope: skip */ }
      } else if (ln.startsWith('-ERR')) { line('nats: ' + esc(ln), 'sys'); }
    }
  };
  ws.onerror = () => dead('ws error');
  ws.onclose = () => { if (natsWs === ws) dead('ws closed'); };
}
function pollFallback(myGen, why) {
  natsWs = null;
  srcMode = 'poll'; paintSrc();
  line('nats unavailable (' + esc(why || '?') + ') — back on long-poll, nothing lost', 'sys');
  setState('reconnecting');
  poll(myGen, activeTab());
}

async function poll(myGen, tab) {
  if (!running || myGen !== gen || !tab) return;
  const t0 = performance.now();
  try {
    const r = await fetch(`wait?since=${tab.since}&channel=${encodeURIComponent(tab.name)}`, { headers: auth(), signal: AbortSignal.any([pollCtrl.signal, AbortSignal.timeout(30000)]) });
    if (r.status === 401 || r.status === 404) throw new Error('unauthorized');
    const data = await r.json();
    if (myGen !== gen) return; // tab switched mid-flight: drop the stale response
    failures = 0;
    if (Array.isArray(data.messages)) {
      // only render messages newer than our cursor (dedup across concurrent wakes)
      const fresh = data.messages.filter(m => (m.seq || 0) > tab.since).sort((a,b) => (a.seq||0) - (b.seq||0));
      fresh.forEach(render);
      if (data.seq > tab.since) tab.since = data.seq;
      // a full batch means the server still has backlog: drain visibly
      const catching = data.messages.length >= BATCH_CAP;
      setState(catching ? 'catching-up' : 'live');
    } else if (data.seq > tab.since) { tab.since = data.seq; setState('live'); }
    else setState('live');
    $('seq').textContent = 'seq ' + tab.since;
    $('lat').textContent = 'wake ' + Math.round(performance.now() - t0) + 'ms';
  } catch (e) {
    if (myGen !== gen) return; // superseded: the new generation owns the loop now
    if (e && e.message === 'unauthorized') return authFailed();
    if (e && e.name === 'TimeoutError') { setState('live'); return poll(myGen, tab); }
    failures++;
    setState('reconnecting', failures > 1 ? ` · try ${failures}` : '');
    if (failures === 1) line('feed hiccup — retrying…', 'sys');
    await new Promise(r => setTimeout(r, Math.min(5000, 500 * failures)));
  }
  poll(myGen, tab);
}

// Definitive auth rejection (401): with server-auth the browser holds no
// token, so a 401 means the server-side feed token is missing or rejected.
// Surface it plainly and keep retrying -- there is nothing to paste.
function authFailed() {
  closeSockets();
  line('feed rejected the request (401) — the server-side feed token looks missing or invalid. Retrying…', 'sys');
  setState('reconnecting');
  const myGen = gen;
  setTimeout(() => { if (myGen === gen && running) boot(); }, 5000);
}

// Initial load per tab: one bounded snapshot (the TAIL most recent messages)
// lands us at the live cursor immediately -- no full-history drain, no reload.
// Switching back to a tab that already snapshotted skips the snapshot and
// resumes the live loop from that tab's own cursor.
async function boot() {
  const myGen = ++gen;
  if (pollCtrl) { try { pollCtrl.abort(); } catch (e) {} } // kill the old generation in flight
  pollCtrl = new AbortController();
  closeSockets();
  const tab = activeTab();
  if (!tab) return;
  setState('loading');
  if (!tab.snapshotted) {
    if (!booted) line('tuned in — pulling the latest traffic…', 'sys');
    try {
      const r = await fetch(`wait?since=0&tail=${TAIL}&channel=${encodeURIComponent(tab.name)}`, { headers: auth(), signal: AbortSignal.any([pollCtrl.signal, AbortSignal.timeout(8000)]) });
      if (r.status === 401 || r.status === 404) throw new Error('unauthorized');
      const data = await r.json();
      if (myGen !== gen) return; // superseded by a tab switch
      if (Array.isArray(data.messages)) {
        data.messages.filter(m => (m.seq || 0) > tab.since)
                     .sort((a,b) => (a.seq||0) - (b.seq||0))
                     .forEach(render);
        if (data.seq > tab.since) tab.since = data.seq;
        // land at the newest traffic: the snapshot is the tail, so start there
        $('log').scrollTop = $('log').scrollHeight;
      }
      tab.snapshotted = true;
      $('seq').textContent = 'seq ' + tab.since;
      setState('live');
      booted = true;
    } catch (e) {
      if (myGen !== gen) return;
      if (e && e.message === 'unauthorized') return authFailed();
      setState('reconnecting');
      await new Promise(r => setTimeout(r, 1500));
      if (running && myGen === gen) return boot();
      return;
    }
  }
  if (srcMode === 'nats') natsLive(myGen, tab);
  else if (srcMode === 'ws') wsLive(myGen, tab);
  else poll(myGen, tab);
}

$('send').onclick = sendMsg;
$('msg').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
});
$('src').onclick = () => {
  srcMode = srcMode === 'poll' ? 'ws' : srcMode === 'ws' ? 'nats' : 'poll';
  paintSrc();
  if (!running || !booted) return;
  const tab = activeTab();
  if (!tab) return;
  line(`live source \u2192 ${srcMode} — resuming #${tab.name} from seq ${tab.since}…`, 'sys');
  boot();
};
paintSrc();

// server-auth: squawk-ui.ts injects window.SERVER_AUTH and proxies with the
// feed token itself -- auto-boot, no gate, no token handling.
document.addEventListener('DOMContentLoaded', () => {
  getTab('fleet');
  activeName = 'fleet';
  renderTabs();
  $('msg').placeholder = 'message #fleet\u2026  (enter to send)';
  running = true;
  boot();
});
</script>
</body>
</html>
