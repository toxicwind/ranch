# .meta-themes.yaml — the canonical theme → repo classification (data, not code).
#
# Read by toolkit/gen-meta-manifest.ts (dumb generator: `map[path] ?? map[topLevel]
# ?? general`, zero kindlex/prefix heuristics, no code monkey-patch). Grounded by
# DDD bounded-context + HiGitClass/MUDABlue (papers in THEME-DESIGN.md): holders are
# domains named by responsibility; this map is CURATED DATA, maintained by slices.
#
# A repo belongs to exactly one holder. `submodules`, `tools`, `vendor` are NEVER
# holders (tracking ≠ domain). Unknown repos fall to `general` — honest fallback.

