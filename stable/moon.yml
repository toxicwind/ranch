$schema: 'https://moonrepo.dev/schemas/project.json'
language: 'typescript'
layer: 'application'
# NOTE: stable previously proxied keeper:build / keeper:lint (first via
# bun --cwd, then via task deps after keeper's promotion to ranch/keeper).
# keeper/ is now an embedded peer checkout, deliberately VCS-ignored by the
# ranch .gitignore (peer-untracking / fold-forward, Oct 2026; canonical repo
# is toxicwind/skopos), so moon skips the keeper project and any dep on
# keeper:* makes the whole task graph invalid (task_builder::unknown_target
# broke push-to-main ci 2026-10-28). stable itself has no package.json and
# no moon-buildable target of its own (browser stack: Dockerfile, scripts),
# so these proxy tasks are removed rather than re-pointed. Do NOT restore
# them by un-ignoring keeper/ — the ignore is intentional.
tasks: {}
